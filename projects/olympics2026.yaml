name: olympics2026
description: Milano-Cortina 2026 Winter Olympic Games (Kaggle piterfm) — fresh post-cutoff test dataset
bronze_database_url: mysql+pymysql://root:password@localhost:3307/olympics2026_bronze
silver_database_url: mysql+pymysql://root:password@localhost:3307/olympics2026_silver
gold_database_url: mysql+pymysql://root:password@localhost:3307/olympics2026_gold
# Generated by the iterative (RIGOR) full phase on 2026-06-14 (gpt-4o gen, gpt-4o-mini judge).
# Value-mapped vocabularies are materialised deterministically from source values
# (one class per concept, one individual per distinct non-null value) — Gender = {M,F,W,X,G},
# byte-identical across regens. Entity-FK promotion (Issue 2) keeps hasScheduleVenue → Venue.
ontology_path: owl/olympics2026_rigor_gpt-4o_14JUN26_4.owl
# Family-shared Fuseki dataset + named graph: every Winter Games materialises into the
# SAME graph so one MCP server (forgemesh-winterolympics) spans all years. Games stay
# distinct via their source-scoped instance URIs (rdf_source_name) over the shared schema.
rdf_dataset_name: winterolympics-mesh
named_graph_uri: http://mesh.local/graph/winterolympics
ontology_named_graph_uri: http://mesh.local/graph/winterolympics/ontology
rdf_source_name: olympics2026
# Schema namespace shared by the whole Winter Olympics family (2026, 2030, …) so
# classes, properties and value-mapped vocabularies (disciplines, …) are the SAME
# URIs across years and aggregate. Data/instance URIs stay source-scoped (olympics2026).
ontology_namespace: winterolympics
# LLM backend: inherit .env's OPENAI_API_KEY (no llm_api_key/llm_base_url pinned → OpenAI).
# Role-specific models: ontology gen = gpt-4o, judge = gpt-4o-mini, mapping = gpt-4o-mini,
# querying = gpt-4o. (Judge requires ONTOLOGY_GENERATOR=iterative at run time.)
ontology_gen_model: gpt-4o
ontology_judge_model: gpt-4o-mini
llm_model: gpt-4o-mini
query_model: gpt-4o
