name: forgemesh

services:
  db:
    image: mysql:8.0
    environment:
      # Defaults match the connection URLs in projects/*.yaml (root:password@localhost:3307).
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bronze_db}
    ports:
      - "${FORGEMESH_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fuseki:
    image: stain/jena-fuseki:latest
    ports:
      - "${FORGEMESH_FUSEKI_PORT:-3030}:3030"
    environment:
      - ADMIN_PASSWORD=admin
      - JVM_ARGS=-Xmx2g
    volumes:
      - fuseki_data:/fuseki
      # Mount the whole directory (writable) rather than a single file. Bind-mounting
      # a lone file makes Docker create /fuseki/configuration as root, which the
      # non-root fuseki user cannot write to ("Not writable: /fuseki/configuration").
      - ./docker/fuseki:/fuseki/configuration

  # Observability stack is opt-in: `docker compose --profile observability up -d`.
  loki:
    profiles: ["observability"]
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./docker/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:latest
    volumes:
      - ./docker/promtail-config.yml:/etc/promtail/config.yml:ro
      - ./runtime/logs:/var/log/forgemesh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    profiles: ["observability"]
    build:
      context: ./docker/grafana
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    depends_on:
      - loki

volumes:
  # Named explicitly so the volumes survive a change of checkout directory or
  # Compose project name. Created on first `up` if absent. Override the names
  # (e.g. in .env) to reuse volumes created under another name, or to run an
  # isolated second stack alongside an existing one.
  mysql_data:
    name: ${FORGEMESH_MYSQL_VOLUME:-forgemesh_mysql_data}
  fuseki_data:
    name: ${FORGEMESH_FUSEKI_VOLUME:-forgemesh_fuseki_data}
  loki_data:
  grafana_data:
