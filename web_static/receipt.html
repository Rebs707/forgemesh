<html lang="en">
<head>

  <style>
    html, body { margin: 0; }
    body {
      background:
        radial-gradient(1200px 700px at 50% -10%, #121614 0%, #0C0E0D 60%) fixed,
        #0C0E0D;
      min-height: 100vh;
      padding: 44px 20px 72px;
    }
    #receipt { max-width: 760px; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="receipt"></div>
  <script src="/js/receipt_view.js"></script>
  <script>
    (function () {
      var m = location.pathname.match(/\/runs\/([^/]+)/);
      var runId = m ? decodeURIComponent(m[1]) : "";
      var el = document.getElementById("receipt");
      ForgeReceipt.load(runId, el);
    })();
  </script>
</body>
</html>
